name: CI

on:
  pull_request:


jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff
        working-directory: app
        run: ruff check .

      - name: Build Docker image
        run: |
          docker build \
            -t notes-api:${{ github.sha }} \
            -f app/dockerfile \
            app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notes-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build Helm dependencies
        run: helm dependency build helm/notes-api

      - name: Helm lint
        run: helm lint helm/notes-api

      - name: Render Helm templates
        run: |
          helm template notes-dev helm/notes-api \
            -f helm/notes-api/values-dev.yaml \
            > rendered.yaml

      - name: Scan Helm configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: rendered.yaml
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"