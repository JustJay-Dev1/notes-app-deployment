apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/JustJay-Dev1/notes-app-deployment.git
    targetRevision: main
    path: helm/notes-api
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: notes-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true